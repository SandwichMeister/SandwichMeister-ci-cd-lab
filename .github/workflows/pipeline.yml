name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint HTML
        id: lint
        continue-on-error: true
        run: npx --yes htmlhint@1.1.4 index.html

      - name: Build image
        run: docker build -t site:ci .

      - name: Smoke test container
        run: |
          docker run -d --name site -p 8080:80 site:ci
          sleep 3
          curl -s http://localhost:8080 > page.html
          grep "SandwichMeister" page.html
          grep "</html>" page.html
          echo "OK"

      - name: Check lint result
        if: steps.lint.outcome == 'failure'
        run: |
          echo "HTML lint failed"
          exit 1

  release:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
